<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>视频号内容审美分级标准 v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--bg2:#0f0f0f;--s1:#141414;--s2:#1a1a1a;--s3:#232323;--s4:#2e2e2e;
  --t:#e8e6e1;--t2:#a09d96;--t3:#6b6863;--t4:#4a4744;
  --ac:#c8a96e;--ac2:#b8963a;
  --gs:#c8a96e;--ga:#7ba3c9;--gb:#8a8a7a;--gc:#8b5a5a;
  --r:8px;--sidebar:220px;
  --serif:'Noto Serif SC','DM Serif Display',Georgia,serif;
  --sans:'Plus Jakarta Sans','Noto Sans SC',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--t);line-height:1.7;font-size:15px;overflow-x:hidden}
::selection{background:var(--ac);color:var(--bg)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--t4)}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
  background:var(--s1);border-right:1px solid var(--s3);
  display:flex;flex-direction:column;z-index:200;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sidebar-header{
  padding:28px 20px 20px;border-bottom:1px solid var(--s3);flex-shrink:0;
}
.sidebar-logo{
  font-family:var(--serif);font-size:16px;font-weight:700;color:var(--t);
  letter-spacing:0.5px;line-height:1.3;
}
.sidebar-logo span{color:var(--ac)}
.sidebar-sub{font-size:11px;color:var(--t3);margin-top:6px;letter-spacing:0.5px}

.sidebar-nav{
  flex:1;overflow-y:auto;padding:12px 0;
  scrollbar-width:thin;scrollbar-color:var(--s4) transparent;
}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

.nav-group-label{
  padding:16px 20px 6px;font-size:10px;font-weight:600;
  color:var(--t4);letter-spacing:2px;text-transform:uppercase;
  user-select:none;
}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 20px 8px 16px;margin:1px 8px;border-radius:6px;
  font-size:13px;color:var(--t3);cursor:pointer;
  position:relative;transition:all .15s ease;user-select:none;
  border-left:3px solid transparent;
}
.nav-item:hover{color:var(--t2);background:rgba(255,255,255,.03)}
.nav-item.active{
  color:var(--ac);background:rgba(200,169,110,.06);
  border-left-color:var(--ac);font-weight:500;
}
.nav-item .nav-icon{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;opacity:.7;
}
.nav-item.active .nav-icon{opacity:1}
.nav-item.gen-item{font-weight:600}
.nav-item.gen-item .nav-icon{color:var(--ac)}

.sidebar-footer{
  padding:16px 20px;border-top:1px solid var(--s3);flex-shrink:0;
  font-size:10px;color:var(--t4);letter-spacing:0.5px;
}

/* ===== MOBILE HAMBURGER ===== */
.hamburger{
  display:none;position:fixed;top:14px;left:14px;z-index:300;
  width:40px;height:40px;border-radius:8px;border:1px solid var(--s3);
  background:rgba(20,20,20,.9);backdrop-filter:blur(12px);
  cursor:pointer;align-items:center;justify-content:center;
  transition:background .2s;
}
.hamburger:hover{background:var(--s2)}
.hamburger span{
  display:block;width:18px;height:2px;background:var(--t2);
  border-radius:1px;position:relative;transition:all .3s;
}
.hamburger span::before,.hamburger span::after{
  content:'';position:absolute;left:0;width:100%;height:2px;
  background:var(--t2);border-radius:1px;transition:all .3s;
}
.hamburger span::before{top:-6px}
.hamburger span::after{top:6px}
.hamburger.open span{background:transparent}
.hamburger.open span::before{top:0;transform:rotate(45deg)}
.hamburger.open span::after{top:0;transform:rotate(-45deg)}

.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:190;opacity:0;transition:opacity .3s;
}
.sidebar-overlay.show{display:block;opacity:1}

/* ===== MAIN CONTENT ===== */
.main-wrap{
  margin-left:var(--sidebar);min-height:100vh;
  background:var(--bg);
}
.content-area{
  max-width:780px;margin:0 auto;padding:48px 40px 120px;
}

/* ===== SECTION HEADER ===== */
.sec{display:none;animation:fadeUp .4s ease}.sec.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.sec-header{
  margin-bottom:40px;padding-bottom:24px;
  border-bottom:1px solid rgba(200,169,110,.1);
}
.sec-overtitle{
  font-size:10px;font-weight:600;color:var(--ac);
  letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;
}
.sec-title{
  font-family:var(--serif);font-size:28px;font-weight:700;
  line-height:1.3;margin-bottom:10px;
}
.sec-logic{
  display:inline-flex;align-items:center;gap:0;
  padding:6px 14px;background:var(--s2);border:1px solid var(--s3);
  border-radius:20px;font-size:12px;color:var(--t2);margin-top:4px;
}
.sec-logic em{font-style:normal;color:var(--ac);margin:0 2px}

/* ===== GRADE PANEL ===== */
.grade-panel{
  margin-bottom:20px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--s3);background:var(--s1);
  transition:border-color .2s;
}
.grade-panel:hover{border-color:var(--s4)}

/* Grade-specific left border */
.grade-panel.g-s{border-left:3px solid var(--gs)}
.grade-panel.g-a{border-left:3px solid var(--ga)}
.grade-panel.g-b{border-left:3px solid var(--gb)}
.grade-panel.g-c{border-left:3px solid var(--gc)}

/* S-grade special background */
.grade-panel.g-s{background:linear-gradient(135deg,rgba(200,169,110,.04) 0%,var(--s1) 60%)}
.grade-panel.g-s .grade-head{background:linear-gradient(90deg,rgba(200,169,110,.08) 0%,transparent 70%)}

.grade-head{
  padding:14px 20px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background .15s;
}
.grade-head:hover{background:rgba(255,255,255,.02)}

.grade-badge{
  padding:3px 12px;border-radius:4px;font-size:11px;
  font-weight:700;letter-spacing:1.5px;color:var(--bg);
  font-family:var(--sans);
}
.grade-badge.gs{background:var(--gs)}
.grade-badge.ga{background:var(--ga)}
.grade-badge.gb{background:var(--gb)}
.grade-badge.gc{background:var(--gc)}

.grade-label{font-size:15px;font-weight:600;letter-spacing:0.3px}
.grade-arrow{
  margin-left:auto;font-size:14px;color:var(--t3);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.grade-panel.open .grade-arrow{transform:rotate(180deg)}

.grade-body{
  max-height:0;overflow:hidden;
  transition:max-height .4s cubic-bezier(.4,0,.2,1);
}
.grade-panel.open .grade-body{max-height:12000px}
.grade-inner{padding:4px 24px 24px}

/* ===== RULE GROUPS ===== */
.rule-group{margin-bottom:16px}
.rule-group h4{
  font-size:12px;font-weight:600;color:var(--ac);
  letter-spacing:0.5px;margin-bottom:10px;
  padding-bottom:4px;
}
.rule-list{list-style:none}
.rule-list li{
  padding:6px 0 6px 28px;position:relative;
  font-size:14px;color:var(--t2);line-height:1.75;
}
.rule-list li::before{
  content:attr(data-num);position:absolute;left:0;top:6px;
  width:20px;height:20px;border-radius:4px;
  background:var(--s3);color:var(--t3);
  font-size:10px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.rule-list li strong{color:var(--t);font-weight:600}

/* ===== CASE SECTION ===== */
.case-divider{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--s3);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}
.case-divider-icon{
  width:20px;height:20px;border-radius:4px;
  background:var(--s3);display:flex;align-items:center;justify-content:center;
  font-size:11px;
}
.case-divider-text{
  font-size:11px;font-weight:600;color:var(--t3);letter-spacing:1.5px;
}
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.case-card{
  background:var(--s2);border:1px solid var(--s3);
  border-radius:var(--r);overflow:hidden;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.case-card:hover{
  border-color:rgba(200,169,110,.15);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}

.case-video{
  position:relative;aspect-ratio:9/16;max-height:360px;
  background:#000;overflow:hidden;cursor:pointer;
}
.case-video.land{aspect-ratio:16/9;max-height:240px}
.case-video video,.case-video img.poster{width:100%;height:100%;object-fit:cover}
.case-video .play-btn{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.25);transition:opacity .2s;
}
.case-video .play-btn svg{width:40px;height:40px;fill:rgba(255,255,255,.85)}
.case-video.playing .play-btn{opacity:0}

.case-info{padding:14px 16px}
.case-author{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.case-avatar{
  width:24px;height:24px;border-radius:50%;overflow:hidden;
  background:var(--s3);flex-shrink:0;
}
.case-avatar img{width:100%;height:100%;object-fit:cover}
.case-name{font-size:12px;font-weight:500}
.case-grade-tag{
  margin-left:auto;font-size:10px;padding:2px 8px;
  border-radius:3px;font-weight:700;letter-spacing:.5px;
}
.case-grade-tag.s{background:rgba(200,169,110,.1);color:var(--gs);border:1px solid rgba(200,169,110,.25)}
.case-grade-tag.a{background:rgba(123,163,201,.1);color:var(--ga);border:1px solid rgba(123,163,201,.25)}
.case-desc{
  font-size:12px;color:var(--t2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:8px;
}
.case-stats{font-size:11px;color:var(--t3)}

/* ===== GRADE LEGEND (in content header for general) ===== */
.grade-legend{
  display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;
}
.grade-legend span{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);
}
.grade-legend i{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.grade-legend .dot-s{background:var(--gs)}
.grade-legend .dot-a{background:var(--ga)}
.grade-legend .dot-b{background:var(--gb)}
.grade-legend .dot-c{background:var(--gc)}

/* ===== SCROLL FADE-IN ===== */
.fade-in-view{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.fade-in-view.visible{opacity:1;transform:translateY(0)}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .main-wrap{margin-left:0}
  .content-area{padding:60px 20px 100px}
  .case-grid{grid-template-columns:1fr}
}
@media(min-width:901px){
  .hamburger{display:none!important}
  .sidebar-overlay{display:none!important}
}
@media(max-width:500px){
  .sec-title{font-size:22px}
  .content-area{padding:56px 16px 80px}
  .grade-inner{padding:4px 16px 20px}
}
</style>
</head>

// Nav icon mapping
const NAV_ICONS={
  general:'\u2605',photo:'\uD83D\uDCF7',food:'\uD83C\uDF73',music:'\uD83C\uDFB5',dance:'\uD83D\uDC83',
  drama:'\uD83C\uDFAD',filmtv:'\uD83C\uDFAC',acg:'\u2B50',vlog:'\uD83C\uDFA5',travel:'\u2708',
  pet:'\uD83D\uDC3E',family:'\uD83D\uDC76',sannong:'\uD83C\uDF3E',game:'\uD83C\uDFAE',sport:'\u26BD',fun:'\uD83C\uDF89'
};

// Sidebar navigation groups
const NAV_GROUPS=[
  {label:null,items:['general']},
  {label:'\u5185\u5BB9\u521B\u4F5C',items:['photo','food','music','dance','drama','filmtv','acg']},
  {label:'\u751F\u6D3B\u8BB0\u5F55',items:['vlog','travel','pet','family','sannong']},
  {label:'\u4E92\u52A8\u5A31\u4E50',items:['game','sport','fun']}
];

function mc(fk,g,land){
  const sid=CASE_MAP[fk];if(!sid||!FEED[sid])return null;const d=FEED[sid];
  return{file:fk,grade:g,author:d.nickname,avatar:d.headImg,
    desc:(d.desc||'').split('\n')[0].trim().substring(0,80),
    stats:'\uD83D\uDC4D'+d.like+' \u00b7 \u8F6C\u53D1'+d.forward+' \u00b7 \u6536\u85CF'+d.fav+' \u00b7 \u8BC4\u8BBA'+d.comment,
    landscape:!!land};
}

function buildSidebar(){
  const nav=document.getElementById('sidebarNav');
  const secMap={};
  SECTIONS.forEach(s=>{secMap[s.id]=s});

  NAV_GROUPS.forEach((group,gi)=>{
    if(group.label){
      const lbl=document.createElement('div');
      lbl.className='nav-group-label';
      lbl.textContent=group.label;
      nav.appendChild(lbl);
    }
    group.items.forEach(id=>{
      const sec=secMap[id];if(!sec)return;
      const item=document.createElement('div');
      item.className='nav-item'+(sec.gen?' gen-item':'')+(gi===0&&group.items[0]===id?' active':'');
      item.dataset.id=id;
      item.innerHTML='<span class="nav-icon">'+( NAV_ICONS[id]||'\u25CB')+'</span><span>'+sec.name+'</span>';
      item.onclick=()=>switchSection(id);
      nav.appendChild(item);
    });
  });
}

function render(){
  const mn=document.getElementById('mn');
  SECTIONS.forEach((sec,si)=>{
    const div=document.createElement('div');
    div.className='sec'+(si===0?' on':'');
    div.id='s-'+sec.id;

    let h='<div class="sec-header"><div class="sec-overtitle">'+sec.over+'</div><h2 class="sec-title">'+sec.title+'</h2>';
    if(sec.logic){h+='<div class="sec-logic">'+sec.logic+'</div>';}
    if(sec.gen){
      h+='<div class="grade-legend"><span><i class="dot-s"></i>S\u00b7\u4F18\u8D28</span><span><i class="dot-a"></i>A\u00b7\u9AD8\u6F5C</span><span><i class="dot-b"></i>B\u00b7\u4E2D\u6027</span><span><i class="dot-c"></i>C\u00b7\u666E\u901A\u53CA\u4EE5\u4E0B</span></div>';
    }
    h+='</div>';

    sec.grades.forEach((gr,gi)=>{
      const isOpen=gi<2;
      let bd='';
      gr.groups.forEach(g=>{
        bd+='<div class="rule-group"><h4>'+g.t+'</h4><ul class="rule-list">';
        g.items.forEach((item,idx)=>{
          bd+='<li data-num="'+(idx+1)+'">'+item+'</li>';
        });
        bd+='</ul></div>';
      });

      if(gr.cases){
        const cases=gr.cases.map(fk=>{
          const cat=fk.split('_')[0];
          const land=['travel'].includes(cat);
          return mc(fk,gr.g,land);
        }).filter(Boolean);
        if(cases.length){
          bd+='<div class="case-divider"><div class="case-divider-icon">\uD83D\uDCCC</div><div class="case-divider-text">\u5178\u578B\u6848\u4F8B</div></div>';
          bd+='<div class="case-grid">';
          cases.forEach(c=>{
            const catKey=c.file.split('_')[0];
            const hasV=HAS_VIDEO.has(catKey);
            const mediaHtml=hasV?
              '<div class="case-video'+(c.landscape?' land':'')+'" onclick="tv(this,event)"><video src="\u6848\u4F8B\u7D20\u6750/videos/'+c.file+'.mp4" poster="\u6848\u4F8B\u7D20\u6750/videos/'+c.file+'_thumb.jpg" preload="metadata" playsinline></video><div class="play-btn"><svg viewBox="0 0 64 64"><path d="M24 16l24 16-24 16z"/></svg></div></div>':
              '<div class="case-video'+(c.landscape?' land':'')+'"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--t3);font-size:12px">\u89C6\u9891\u5F85\u8865\u5145</div></div>';
            const gl=c.grade==='s'?'S\u00b7\u4F18\u8D28':'A\u00b7\u9AD8\u6F5C';
            bd+='<div class="case-card">'+mediaHtml+'<div class="case-info"><div class="case-author"><div class="case-avatar"><img src="'+c.avatar+'" onerror="this.parentElement.innerHTML=\'<div style=padding:4px;text-align:center;font-size:11px>'+c.author[0]+'</div>\'"/></div><span class="case-name">'+c.author+'</span><span class="case-grade-tag '+c.grade+'">'+gl+'</span></div><div class="case-desc">'+c.desc+'</div><div class="case-stats">'+c.stats+'</div></div></div>';
          });
          bd+='</div>';
        }
      }

      h+='<div class="grade-panel g-'+gr.g+(isOpen?' open':'')+' fade-in-view">';
      h+='<div class="grade-head" onclick="this.parentElement.classList.toggle(\'open\')">';
      h+='<span class="grade-badge g'+gr.g+'">'+gr.g.toUpperCase()+'</span>';
      h+='<span class="grade-label">'+gr.label+'</span>';
      h+='<span class="grade-arrow">\u25BE</span>';
      h+='</div>';
      h+='<div class="grade-body"><div class="grade-inner">'+bd+'</div></div>';
      h+='</div>';
    });

    div.innerHTML=h;
    mn.appendChild(div);
  });
}

function switchSection(id){
  // Update nav
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  // Update content
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));
  // Scroll to top
  window.scrollTo({top:0,behavior:'smooth'});
  // Close mobile sidebar
  if(window.innerWidth<=900){closeSidebar();}
  // Re-observe fade-in elements
  requestAnimationFrame(()=>observeFadeIns());
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const hb=document.getElementById('hamburger');
  const ov=document.getElementById('sidebarOverlay');
  const isOpen=sb.classList.contains('open');
  if(isOpen){closeSidebar();}else{
    sb.classList.add('open');hb.classList.add('open');
    ov.classList.add('show');
    document.body.style.overflow='hidden';
  }
}
function closeSidebar(){
  const sb=document.getElementById('sidebar');
  const hb=document.getElementById('hamburger');
  const ov=document.getElementById('sidebarOverlay');
  sb.classList.remove('open');hb.classList.remove('open');
  ov.classList.remove('show');
  document.body.style.overflow='';
}

function tv(w,e){
  e.stopPropagation();const v=w.querySelector('video');if(!v)return;
  if(v.paused){
    document.querySelectorAll('.case-video video').forEach(x=>{if(x!==v){x.pause();x.parentElement.classList.remove('playing')}});
    v.play();w.classList.add('playing');
  }else{v.pause();w.classList.remove('playing');}
}

// Scroll fade-in observer
function observeFadeIns(){
  const els=document.querySelectorAll('.fade-in-view:not(.visible)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('visible'));return;}
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('visible');obs.unobserve(en.target);}});
  },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
  els.forEach(el=>obs.observe(el));
}

// Init
buildSidebar();
render();
observeFadeIns();
</script>
